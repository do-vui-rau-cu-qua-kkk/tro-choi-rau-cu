<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Siêu Đố Vui Rau Củ Quả 3D (50,000+ Câu Hỏi)</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      overflow: hidden;
      background-color: #111827;
      color: #fff;
    }

    #canvas-container {
      width: 100vw;
      height: 100vh;
      position: absolute;
      top: 0;
      left: 0;
      z-index: 1;
    }

    #ui-container {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 2;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      align-items: center;
      padding: 20px;
      pointer-events: none;
    }

    .top-bar {
      display: flex;
      gap: 20px;
      background: rgba(15, 23, 42, 0.75);
      backdrop-filter: blur(10px);
      padding: 12px 25px;
      border-radius: 30px;
      border: 1px solid rgba(255, 255, 255, 0.1);
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
    }

    .stat-item {
      font-size: 16px;
      font-weight: 600;
      color: #38bdf8;
    }

    .stat-value {
      color: #facc15;
    }

    .quiz-card {
      background: rgba(255, 255, 255, 0.95);
      color: #1e293b;
      padding: 25px 30px;
      border-radius: 24px;
      max-width: 550px;
      width: 100%;
      text-align: center;
      pointer-events: auto;
      box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5);
      margin-bottom: 20px;
      transition: all 0.3s ease;
    }

    .question-tag {
      display: inline-block;
      background: #e0f2fe;
      color: #0369a1;
      padding: 4px 12px;
      border-radius: 12px;
      font-size: 13px;
      font-weight: 700;
      margin-bottom: 12px;
      text-transform: uppercase;
    }

    .question-text {
      font-size: 18px;
      font-weight: 700;
      line-height: 1.5;
      margin-bottom: 20px;
      color: #0f172a;
    }

    .options-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    .btn-option {
      background: #f1f5f9;
      color: #334155;
      border: 2px solid #e2e8f0;
      padding: 14px;
      font-size: 15px;
      font-weight: 600;
      border-radius: 14px;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .btn-option:hover {
      background: #22c55e;
      color: #ffffff;
      border-color: #22c55e;
      transform: translateY(-2px);
    }

    .feedback {
      margin-top: 15px;
      font-weight: 700;
      font-size: 16px;
      min-height: 24px;
    }

    .correct-text { color: #16a34a; }
    .wrong-text { color: #dc2626; }
  </style>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
</head>
<body>

  <div id="canvas-container"></div>

  <div id="ui-container">
    <div class="top-bar">
      <div class="stat-item">Câu: <span class="stat-value" id="q-count">1</span> / 50,000+</div>
      <div class="stat-item">Điểm: <span class="stat-value" id="score">0</span></div>
      <div class="stat-item">Chuỗi: <span class="stat-value" id="streak">0</span> 🔥</div>
    </div>

    <div class="quiz-card">
      <div class="question-tag" id="q-type">Đố vui dân gian</div>
      <div class="question-text" id="q-text">Đang tạo câu hỏi...</div>
      <div class="options-grid" id="options-box"></div>
      <div class="feedback" id="feedback"></div>
    </div>
  </div>

  <script>
    // ==========================================
    // 1. CƠ SỞ DỮ LIỆU CỐT LÕI (VEGGIE DATABASE)
    // ==========================================
    const db = [
      { id: 'carrot', name: 'Củ Cà Rốt', color: 'màu cam', shape: 'dài thon', taste: 'ngọt mát', benefit: 'bổ mắt (vitamin A)', riddle: 'Củ gì màu cam rực rỡ, Thỏ ta khoái khoái ăn hoài không chán?' },
      { id: 'corn', name: 'Bắp Ngô', color: 'màu vàng', shape: 'hình bắp hạt xếp hàng', taste: 'ngọt dẻo', benefit: 'giàu xơ', riddle: 'Thân mặc nhiều áo lá, hạt xếp đều tăm tắp, râu dài như ông lão?' },
      { id: 'radish', name: 'Củ Cải Trắng', color: 'màu trắng', shape: 'dài thuôn', taste: 'thanh ngọt', benefit: 'tốt cho tiêu hóa', riddle: 'Củ gì củ trắng ruột mềm, Nấu canh hay luộc ăn đều ngọt ngon?' },
      { id: 'tomato', name: 'Quả Cà Chua', color: 'màu đỏ', shape: 'tròn mọng', taste: 'chua ngọt', benefit: 'đẹp da (lycopene)', riddle: 'Tên gọi là cà nhưng không ai muối xổi, chín đỏ mọng nước xào nấu món ngon?' },
      { id: 'pumpkin', name: 'Quả Bí Ngô', color: 'màu vàng đốm cam', shape: 'tròn khía to', taste: 'bùi ngậy', benefit: 'bổ não', riddle: 'Quả gì vỏ cứng da cam, halloween đến làm đèn lập lòe?' },
      { id: 'cucumber', name: 'Dưa Chuột', color: 'màu xanh lá', shape: 'thôn dài', taste: 'mát lành', benefit: 'cấp nước', riddle: 'Thân dây bò giàn, quả xanh dài mượt, ăn sống giải nhiệt?' },
      { id: 'eggplant', name: 'Cà Tím', color: 'màu tím', shape: 'dài cong', taste: 'mềm ngọt', benefit: 'giảm cholesterol', riddle: 'Cả đời mặc áo tím than, xào bung hay nướng thơm lừng bữa cơm?' },
      { id: 'potato', name: 'Củ Khoai Tây', color: 'màu vàng nâu', shape: 'tròn bầu dục', taste: 'bùi béo', benefit: 'giàu tinh bột', riddle: 'Củ gì nằm dưới mặt đất, chiên giòn thơm phức trẻ con đều thèm?' }
    ];

    const templates = [
      { type: "Đố vui dân gian", get: (item) => item.riddle },
      { type: "Nhận biết đặc điểm", get: (item) => `Loại rau củ quả nào có đặc điểm: ${item.color}, có dạng ${item.shape}?` },
      { type: "Dinh dưỡng & Sức khỏe", get: (item) => `Loại thực phẩm nào chứa nhiều dưỡng chất giúp ${item.benefit}?` },
      { type: "Hương vị & Chế biến", get: (item) => `Rau/củ/quả nào có hương vị ${item.taste} đặc trưng khi thưởng thức?` },
      { type: "Truy tìm tên gọi", get: (item) => `Đâu là tên gọi chính xác của loại củ/quả có màu ${item.color}?` }
    ];

    let currentQuestion = null;
    let score = 0;
    let streak = 0;
    let qCount = 1;

    // ==========================================
    // 2. THUẬT TOÁN SINH CÂU HỎI TỰ ĐỘNG (50K+)
    // ==========================================
    function generateQuestion() {
      // Chọn ngẫu nhiên 1 thực phẩm làm đáp án
      const correctItem = db[Math.floor(Math.random() * db.length)];
      
      // Chọn ngẫu nhiên mẫu câu hỏi
      const template = templates[Math.floor(Math.random() * templates.length)];
      const questionText = template.get(correctItem);

      // Lấy 3 lựa chọn sai ngẫu nhiên không trùng với đáp án
      const wrongItems = db.filter(i => i.id !== correctItem.id);
      const shuffledWrongs = wrongItems.sort(() => 0.5 - Math.random()).slice(0, 3);

      // Trộn đáp án
      const options = [correctItem, ...shuffledWrongs].sort(() => 0.5 - Math.random());

      return {
        type: template.type,
        text: questionText,
        options: options.map(o => o.name),
        answerIndex: options.findIndex(o => o.id === correctItem.id),
        itemId: correctItem.id
      };
    }

    // ==========================================
    // 3. THREE.JS 3D GRAPHICS SYSTEM
    // ==========================================
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x0f172a);

    const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
    camera.position.set(0, 2.5, 7);

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(window.devicePixelRatio);
    renderer.shadowMap.enabled = true;
    document.getElementById('canvas-container').appendChild(renderer.domElement);

    const controls = new THREE.OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.maxPolarAngle = Math.PI / 2;

    // Ánh sáng
    scene.add(new THREE.AmbientLight(0xffffff, 0.7));
    const light = new THREE.DirectionalLight(0xffffff, 0.8);
    light.position.set(5, 10, 5);
    light.castShadow = true;
    scene.add(light);

    // Bục đỡ
    const pedestal = new THREE.Mesh(
      new THREE.CylinderGeometry(2, 2.2, 0.4, 32),
      new THREE.MeshStandardMaterial({ color: 0x334155, roughness: 0.3 })
    );
    pedestal.position.y = -1;
    scene.add(pedestal);

    let activeModel = null;

    // Hàm dựng mô hình 3D cho từng loại
    function create3DModel(id) {
      const group = new THREE.Group();
      let mat;

      if (id === 'carrot') {
        mat = new THREE.MeshStandardMaterial({ color: 0xf97316 });
        const body = new THREE.Mesh(new THREE.ConeGeometry(0.7, 2.5, 16), mat);
        body.rotation.x = Math.PI;
        group.add(body);
      } else if (id === 'tomato') {
        mat = new THREE.MeshStandardMaterial({ color: 0xef4444 });
        const body = new THREE.Mesh(new THREE.SphereGeometry(1, 32, 32), mat);
        group.add(body);
      } else if (id === 'corn') {
        mat = new THREE.MeshStandardMaterial({ color: 0xeab308 });
        const body = new THREE.Mesh(new THREE.CylinderGeometry(0.5, 0.4, 2.2, 16), mat);
        group.add(body);
      } else {
        // Mặc định dạng củ/quả tổng quát
        mat = new THREE.MeshStandardMaterial({ color: 0x22c55e });
        const body = new THREE.Mesh(new THREE.DodecahedronGeometry(1), mat);
        group.add(body);
      }

      group.position.y = 0.2;
      return group;
    }

    function updateModel(id) {
      if (activeModel) scene.remove(activeModel);
      activeModel = create3DModel(id);
      scene.add(activeModel);
    }

    // ==========================================
    // 4. GAME LOGIC & UI INTERACTION
    // ==========================================
    function renderQuiz() {
      currentQuestion = generateQuestion();

      document.getElementById('q-count').innerText = qCount.toLocaleString();
      document.getElementById('q-type').innerText = currentQuestion.type;
      document.getElementById('q-text').innerText = currentQuestion.text;
      document.getElementById('feedback').innerText = '';

      const box = document.getElementById('options-box');
      box.innerHTML = '';

      currentQuestion.options.forEach((opt, idx) => {
        const btn = document.createElement('button');
        btn.className = 'btn-option';
        btn.innerText = opt;
        btn.onclick = () => selectOption(idx);
        box.appendChild(btn);
      });

      updateModel(currentQuestion.itemId);
    }

    let isJumping = false;
    let jumpTime = 0;

    function selectOption(index) {
      const feedback = document.getElementById('feedback');

      if (index === currentQuestion.answerIndex) {
        score += 10 + streak * 2;
        streak++;
        feedback.innerText = "✨ Chính xác! +10 điểm";
        feedback.className = "feedback correct-text";
        
        isJumping = true;
        jumpTime = 0;

        setTimeout(() => {
          qCount++;
          document.getElementById('score').innerText = score;
          document.getElementById('streak').innerText = streak;
          renderQuiz();
        }, 1200);
      } else {
        streak = 0;
        document.getElementById('streak').innerText = streak;
        feedback.innerText = "❌ Tiếc quá, chưa chính xác!";
        feedback.className = "feedback wrong-text";
      }
    }

    // Loop
    function animate() {
      requestAnimationFrame(animate);

      if (activeModel) {
        activeModel.rotation.y += 0.01;

        if (isJumping) {
          jumpTime += 0.15;
          activeModel.position.y = 0.2 + Math.abs(Math.sin(jumpTime)) * 0.8;
          if (jumpTime > Math.PI) {
            isJumping = false;
            activeModel.position.y = 0.2;
          }
        }
      }

      controls.update();
      renderer.render(scene, camera);
    }

    // Init Game
    renderQuiz();
    animate();

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });
  </script>
</body>
</html>
